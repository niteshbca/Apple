<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PWA Inventory</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff4d4d">

<style>
body{margin:0;background:#f6f6f6;font-family:Arial}
header{padding:10px;text-align:center;background:#ff4d4d;color:#fff}
.status{font-size:14px}
.container{padding:15px}
.item{background:#fff;margin:10px 0;padding:15px;border-radius:10px}
button{padding:6px 12px;margin:3px}
.admin{background:#222;color:#fff;padding:10px;border-radius:10px}
</style>
</head>

<body>
<header>
  <h2>📦 Inventory PWA</h2>
  <div id="net" class="status">Offline</div>
</header>

<div class="container">

<div class="admin">
  <input id="name" placeholder="Item name">
  <button onclick="create()">➕ Add</button>
</div>

<div id="list"></div>

</div>

<script>
/* ================= CONFIG ================= */
const API = "http://localhost:3000";

/* ================= INDEXED DB ================= */
let db;
const openDB = indexedDB.open("inventoryDB", 1);
openDB.onupgradeneeded = e => {
  db = e.target.result;
  db.createObjectStore("items", { keyPath: "name" });
};
openDB.onsuccess = e => {
  db = e.target.result;
  loadLocal();
};

/* ================= STATE ================= */
let items = {};
const list = document.getElementById("list");

/* ================= UI ================= */
function render(){
  list.innerHTML="";
  for(let k in items){
    let i = items[k];
    list.innerHTML += `
      <div class="item">
        <b>${k}</b>
        <h2>${i.count}</h2>
        <button onclick="update('${k}',1)">+</button>
        <button onclick="update('${k}',-1)">-</button>
        <button onclick="remove('${k}')">🗑</button>
      </div>`;
  }
}

/* ================= LOCAL DB ================= */
function saveLocal(item){
  const tx=db.transaction("items","readwrite");
  tx.objectStore("items").put(item);
}
function deleteLocal(name){
  const tx=db.transaction("items","readwrite");
  tx.objectStore("items").delete(name);
}
function loadLocal(){
  const tx=db.transaction("items","readonly");
  tx.objectStore("items").getAll().onsuccess=e=>{
    e.target.result.forEach(i=>items[i.name]=i);
    render();
  }
}

/* ================= CRUD ================= */
function create(){
  const name=document.getElementById("name").value.toLowerCase();
  if(!name||items[name])return;
  items[name]={name,count:0,pending:0};
  saveLocal(items[name]);
  render();
  if(navigator.onLine) fetch(API+"/create",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});
}

function update(name,delta){
  const i=items[name];
  if(i.count+delta<0)return;
  i.count+=delta;
  i.pending+=delta;
  saveLocal(i);
  render();
  if(navigator.onLine) sync(name);
}

function remove(name){
  delete items[name];
  deleteLocal(name);
  render();
  if(navigator.onLine) fetch(API+"/delete/"+name,{method:"DELETE"});
}

/* ================= SYNC ================= */
async function sync(name){
  const i=items[name];
  if(!i.pending)return;
  const r=await fetch(API+"/update",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(i)});
  const d=await r.json();
  i.count=d.count;i.pending=0;
  saveLocal(i);
  render();
}

/* ================= ONLINE/OFFLINE ================= */
function net(){
  document.getElementById("net").innerText=navigator.onLine?"🟢 Online":"🔴 Offline";
  if(navigator.onLine) Object.keys(items).forEach(sync);
}
window.addEventListener("online",net);
window.addEventListener("offline",net);
net();

/* ================= SERVICE WORKER ================= */
if("serviceWorker"in navigator){
  navigator.serviceWorker.register("service-worker.js");
}
</script>
</body>
</html>
