<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NITESH KUMAR SINGH</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff4d4d">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box;font-family:Segoe UI,sans-serif}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#ffecd2,#fcb69f);
  display:flex;
  align-items:center;
  justify-content:center;
}

/* 🔔 Online / Offline Status */
.status{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  padding:6px 14px;
  border-radius:20px;
  font-size:14px;
  color:#fff;
  display:flex;
  gap:6px;
  z-index:9999;
}
.online{background:#2ecc71}
.offline{background:#e74c3c}

.card{
  background:#fff;
  padding:25px;
  border-radius:18px;
  width:90%;
  max-width:360px;
  text-align:center;
  box-shadow:0 12px 30px rgba(0,0,0,.15);
}

h2{margin:0}
h1{
  font-size:64px;
  margin:15px 0;
  color:#ff4d4d;
  transition:.2s;
}

.btns{
  display:flex;
  gap:10px;
  margin-top:20px;
}
button{
  flex:1;
  padding:14px;
  font-size:16px;
  border:none;
  border-radius:14px;
  color:#fff;
  cursor:pointer;
}
.add{background:#2ecc71}
.sub{background:#ff5252}
.refresh{background:#3498db}

button:active{transform:scale(.95)}

/* 🎉 Celebration */
.emoji{
  position:fixed;
  top:-20px;
  font-size:26px;
  animation:fall linear forwards;
  z-index:9998;
}
@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg);opacity:0}
}
</style>
</head>

<body>

<div id="netStatus" class="status offline">🔴 Offline</div>

<div class="card">
  <h2>🍎 Apple Count</h2>
  <h1 id="count">0</h1>

  <div class="btns">
    <button class="add" onclick="add()">+ Apple</button>
    <button class="sub" onclick="sub()">- Apple</button>
  </div>

  <div class="btns">
    <button class="refresh" onclick="manualRefresh()">🔄 Refresh</button>
  </div>
</div>

<script>
const API="https://apple-rj1b.onrender.com";

let localCount = Number(localStorage.getItem("count")) || 0;
let pending    = Number(localStorage.getItem("pending")) || 0;

const countEl  = document.getElementById("count");
const statusEl = document.getElementById("netStatus");

/* 🔄 Render */
function render(){
  countEl.innerText = localCount;
  countEl.style.transform="scale(1.2)";
  setTimeout(()=>countEl.style.transform="scale(1)",150);
}

/* 💾 Save */
function save(){
  localStorage.setItem("count", localCount);
  localStorage.setItem("pending", pending);
}

/* 🎉 Celebration */
function celebrate(){
  const icons=["🎉","🎊","🚀","👏","🍎","✨"];
  for(let i=0;i<30;i++){
    const e=document.createElement("div");
    e.className="emoji";
    e.innerText=icons[Math.floor(Math.random()*icons.length)];
    e.style.left=Math.random()*100+"vw";
    e.style.animationDuration=(1+Math.random()*1.5)+"s";
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),2000);
  }
}

/* ➕ ➖ */
function add(){
  localCount++; pending++;
  save(); render(); celebrate();
  if(navigator.onLine) sync();
}
function sub(){
  if(localCount===0) return;
  localCount--; pending--;
  save(); render(); celebrate();
  if(navigator.onLine) sync();
}

/* 🌐 Sync Pending Changes */
async function sync(){
  if(pending===0) return;

  const res = await fetch(API+"/update",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({delta:pending})
  });
  const data = await res.json();
  localCount = data.count;
  pending = 0;
  save(); render();
}

/* 📥 Always Get Latest Server Data */
async function fetchLatest(){
  if(!navigator.onLine) return;
  const res = await fetch(API+"/count");
  const data = await res.json();
  localCount = data.count;
  pending = 0;
  save(); render();
}

/* 🔔 Network Status Auto */
function updateNetStatus(){
  if(navigator.onLine){
    statusEl.className="status online";
    statusEl.innerHTML="🟢 Online";

    // 🔥 Internet आते ही:
    sync();        // pending local → server
    fetchLatest(); // server → latest data (mobile → desktop)
  }else{
    statusEl.className="status offline";
    statusEl.innerHTML="🔴 Offline";
  }
}

/* 🔄 Manual Refresh */
function manualRefresh(){
  fetchLatest();
  celebrate();
}

/* 🌍 Events */
window.addEventListener("online", updateNetStatus);
window.addEventListener("offline", updateNetStatus);

/* 🚀 Init */
updateNetStatus();
render();

/* ✅ Service Worker */
if("serviceWorker"in navigator){
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
