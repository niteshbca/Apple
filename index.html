<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NITESH KUMAR SINGH</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff4d4d">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box;font-family:Segoe UI,sans-serif}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#ffecd2,#fcb69f);
  display:flex;
  align-items:center;
  justify-content:center;
}

.status{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  padding:6px 14px;
  border-radius:20px;
  font-size:14px;
  color:#fff;
  z-index:9999;
}
.online{background:#2ecc71}
.offline{background:#e74c3c}

.card{
  background:#fff;
  padding:25px;
  border-radius:18px;
  width:90%;
  max-width:360px;
  text-align:center;
  box-shadow:0 12px 30px rgba(0,0,0,.15);
}

h1{
  font-size:64px;
  margin:15px 0;
  color:#ff4d4d;
}

.btns{
  display:flex;
  gap:10px;
}
button{
  flex:1;
  padding:14px;
  font-size:16px;
  border:none;
  border-radius:14px;
  color:#fff;
  cursor:pointer;
}
.add{background:#2ecc71}
.sub{background:#ff5252}
.refresh{background:#3498db}
</style>
</head>

<body>

<div id="netStatus" class="status offline">🔴 Offline</div>

<div class="card">
  <h2>🍎 Apple Count</h2>
  <h1 id="count">0</h1>

  <div class="btns">
    <button class="add" onclick="add()">+ Apple</button>
    <button class="sub" onclick="sub()">- Apple</button>
  </div>

  <br>
  <button class="refresh" onclick="fetchLatest()">🔄 Refresh</button>
</div>

<script>
/* ================= CONFIG ================= */
const API = "https://apple-rj1b.onrender.com";

/* ================= STATE ================= */
let localCount = Number(localStorage.getItem("count")) || 0;
let pending    = Number(localStorage.getItem("pending")) || 0;

const countEl  = document.getElementById("count");
const statusEl = document.getElementById("netStatus");

/* ================= UI ================= */
function render(){
  countEl.innerText = localCount;
}

function save(){
  localStorage.setItem("count", localCount);
  localStorage.setItem("pending", pending);
}

/* ================= BUTTON ACTION ================= */
function add(){
  localCount++;
  pending++;
  save();
  render();
  if(navigator.onLine) syncPending();
}

function sub(){
  if(localCount === 0) return;
  localCount--;
  pending--;
  save();
  render();
  if(navigator.onLine) syncPending();
}

/* ================= OFFLINE → ONLINE SYNC ================= */
async function syncPending(){
  if(!navigator.onLine || pending === 0) return;

  const r = await fetch(API + "/update", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ delta: pending })
  });

  const d = await r.json();

  /* 🔥 SERVER IS SINGLE SOURCE OF TRUTH */
  localCount = d.count;
  pending = 0;

  save();
  render();
}

/* ================= SERVER → CLIENT ================= */
async function fetchLatest(){
  if(!navigator.onLine) return;

  const r = await fetch(API + "/count");
  const d = await r.json();

  if(d.count !== localCount){
    localCount = d.count;
    pending = 0;
    save();
    render();
  }
}

/* ================= NETWORK STATUS ================= */
function updateNetStatus(){
  if(navigator.onLine){
    statusEl.className = "status online";
    statusEl.innerHTML = "🟢 Online";
    syncPending();
    fetchLatest();
  }else{
    statusEl.className = "status offline";
    statusEl.innerHTML = "🔴 Offline";
  }
}

window.addEventListener("online", updateNetStatus);
window.addEventListener("offline", updateNetStatus);

/* ================= AUTO REAL-TIME POLLING ================= */
/* 🔁 EVERY 1 SECOND – Desktop ↔ Mobile sync */
setInterval(() => {
  fetchLatest();
}, 1000);

/* ================= INIT ================= */
updateNetStatus();
render();

/* ================= SERVICE WORKER ================= */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
