<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NITESH KUMAR SINGH</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff4d4d">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
*{box-sizing:border-box;font-family:Segoe UI,sans-serif}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#ffecd2,#fcb69f);
  display:flex;
  align-items:center;
  justify-content:center;
}

/* 🔔 Online Offline Bar */
.status{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  padding:6px 14px;
  border-radius:20px;
  font-size:14px;
  color:#fff;
  z-index:9999;
  display:flex;
  align-items:center;
  gap:6px;
}
.online{background:#2ecc71}
.offline{background:#e74c3c}

.card{
  background:#fff;
  padding:25px;
  border-radius:18px;
  width:90%;
  max-width:350px;
  text-align:center;
  box-shadow:0 12px 30px rgba(0,0,0,.15);
}

h2{margin:0;font-size:22px}
h1{
  font-size:64px;
  margin:15px 0;
  color:#ff4d4d;
  transition:.2s;
}

.btns{
  display:flex;
  gap:12px;
  margin-top:20px;
}
button{
  flex:1;
  padding:14px;
  font-size:20px;
  border:none;
  border-radius:14px;
  color:#fff;
  cursor:pointer;
}
.add{background:linear-gradient(135deg,#4caf50,#2ecc71)}
.sub{background:linear-gradient(135deg,#ff5252,#ff1744)}
button:active{transform:scale(.95)}

/* 🎉 Celebration */
.celebrate{
  position:fixed;
  top:-20px;
  font-size:26px;
  animation:fall linear forwards;
  z-index:9998;
}
@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg);opacity:0}
}
</style>
</head>

<body>

<div id="netStatus" class="status online">🟢 Online</div>

<div class="card">
  <h2>🍎 Apple Count</h2>
  <h1 id="count">0</h1>
  <div class="btns">
    <button class="add" onclick="add()">+ Apple</button>
    <button class="sub" onclick="sub()">- Apple</button>
  </div>
</div>

<script>
const API="https://apple-rj1b.onrender.com";
let localCount=Number(localStorage.getItem("count"))||0;
let pending=Number(localStorage.getItem("pending"))||0;
const el=document.getElementById("count");

/* 🔄 Render */
function render(){
  el.innerText=localCount;
  el.style.transform="scale(1.2)";
  setTimeout(()=>el.style.transform="scale(1)",150);
}
function save(){
  localStorage.setItem("count",localCount);
  localStorage.setItem("pending",pending);
}

/* 🎊 FULL Celebration */
function celebrate(){
  const icons=["🎉","🎊","🚀","🍎","👏","✨","💥"];
  for(let i=0;i<35;i++){
    const e=document.createElement("div");
    e.className="celebrate";
    e.innerText=icons[Math.floor(Math.random()*icons.length)];
    e.style.left=Math.random()*100+"vw";
    e.style.animationDuration=(1+Math.random()*1.5)+"s";
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),2000);
  }
}

/* ➕ ➖ */
function add(){
  localCount++; pending++;
  save(); render(); celebrate();
  if(navigator.onLine) sync();
}
function sub(){
  if(localCount===0) return;
  localCount--; pending--;
  save(); render(); celebrate();
  if(navigator.onLine) sync();
}

/* 🌐 Server Sync */
async function sync(){
  if(pending===0) return;
  const r=await fetch(API+"/update",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({delta:pending})
  });
  const d=await r.json();
  localCount=d.count;
  pending=0;
  save(); render();
}
async function load(){
  if(!navigator.onLine) return;
  const r=await fetch(API+"/count");
  const d=await r.json();
  localCount=d.count;
  pending=0;
  save(); render();
}

/* 🔔 Online Offline Indicator */
const statusEl=document.getElementById("netStatus");
function updateStatus(){
  if(navigator.onLine){
    statusEl.className="status online";
    statusEl.innerHTML="🟢 Online";
    sync();
  }else{
    statusEl.className="status offline";
    statusEl.innerHTML="🔴 Offline";
  }
}
window.addEventListener("online",updateStatus);
window.addEventListener("offline",updateStatus);

/* Init */
navigator.onLine ? load() : updateStatus();
render();

/* ✅ Service Worker */
if("serviceWorker"in navigator){
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
